name: Build APK & Windows PC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ================= 1. BUILD ANDROID =================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6' 
          channel: 'stable'

      - name: Tarik Library Dependensi
        run: flutter pub get

      - name: Rakit File APK Resmi
        run: flutter build apk --split-per-abi

      - name: Upload APK Jadi Ke Browser
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-sales-sukses-apk
          path: build/app/outputs/flutter-apk/*.apk

  # ================= 2. BUILD WINDOWS PC =================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Enable Windows Desktop & Pub Get
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Rakit File Executable Windows
        run: flutter build windows --release

      - name: Zip Folder Release
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath aplikasi-sales-windows.zip

      - name: Upload Windows ZIP Ke Browser
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-sales-sukses-windows
          path: aplikasi-sales-windows.zip
